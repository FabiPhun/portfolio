<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portfolio gallery template</title>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="navbar-container" directoryFix="../"></div>

    <div class="body_content">
        <div
            class="gallery_wrapper"
            image-spacing="5px"
            maxImages="5"
            folder-path="../images/modelling_and_rigging"
            images="blinds.jpeg, bowtie.jpeg, ember_test.jpeg, floorng.png, fredbear.jpeg, friendship.png, hallway.jpeg, lantern.jpeg, lara_front.jpeg, lara_side.jpeg, office_lit.jpeg, office_top.jpeg, rocks.png, room.jpeg, samus_fullbody.png, skirting.png, william_front.png"
            fc-gallery="list"
            row-stretch="0">
        </div>
    </div>

    <!-- components -->
    <script src="../components/gallery_component.js"></script>
    <script src="../components/navbar/navbar.js"></script>
</body>
</html>
