<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portfolio gallery template</title>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="body_content" id="page-content">

        <div class="body_item_wrapper">
            <div class="body_item">
                
                <div class="gallery_section_wrapper">
                    <h2>William Afton</h2>
                    <div
                        class="gallery_wrapper"
                        image-spacing="5px"
                        maxImages="5"
                        folder-path="../images/character_design/was"
                        images="william_head.png, william_head_final.png, William_Fullbody_final.png"
                        >
                    </div>
                </div>

                <div class="gallery_section_wrapper">
                    <h2>Amy</h2>
                    <div
                        class="gallery_wrapper"
                        image-spacing="5px"
                        maxImages="5"
                        folder-path="../images/character_design/was"
                        images="girl_3.png, little_girl_styleideas.png*, Facial_F.png, 3.png"
                        >
                    </div>
                </div>

                <div class="gallery_section_wrapper">
                    <h2>Ember</h2>
                    <div
                        class="gallery_wrapper"
                        image-spacing="5px"
                        maxImages="5"
                        folder-path="../images/character_design/icarus"
                        images="ica4.png, ember_idea.png*, icarus_1.png, headtest.png, aaa.png*, icarus_2.png, ember_west.png">
                    </div>
                </div>

                <div class="gallery_section_wrapper">
                <h2>miscellaneous</h2>
                    <div
                        class="gallery_wrapper"
                        image-spacing="5px"
                        maxImages="5"
                        folder-path="../images/character_design/misc"
                        images="Final.png, cindy.png*, Jim.png, cloudgirl.png, firehad.png*, d00dledate.png, head.png, Screenshot_17.png">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- components -->
    <script src="../components/gallery_component.js"></script>
    </body>
</html>
