<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portfolio gallery template</title>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="body_content" id="page-content">

        <div class="body_item_wrapper">
            <div class="body_item">

                <div class="gallery_section_wrapper">
                    <h2>©Siegfrieds' Mechanical Musiccabinett</h2>
                    <div
                        class="gallery_wrapper"
                        image-spacing="5px"
                        maxImages="4"
                        folder-path="../images/graphical_design/smmk"
                        images="moodboard.png, box.png, s1.png*, broshure.png, broshure_in.png*, s2.png, s3.png, s4.png">
                    </div>
                </div>

                <div class="gallery_section_wrapper">
                    <h2>BEES</h2>
                    <div
                        class="gallery_wrapper"
                        image-spacing="5px"
                        maxImages="4"
                        folder-path="../images/graphical_design/bees"
                        images="magicbike.png, guest.png, magicbike_logo.png">
                    </div>
                </div>

                <div class="gallery_section_wrapper">
                    <h2>Nintendo®</h2>
                    <div
                        class="gallery_wrapper"
                        image-spacing="5px"
                        maxImages="4"
                        folder-path="../images/graphical_design"
                        images="animalcrossing.png, animalcrossing_mask.png">
                    </div>
                </div>

                <div class="gallery_section_wrapper">
                    <h2>miscellaneous</h2>
                    <div
                        class="gallery_wrapper"
                        image-spacing="5px"
                        maxImages="4"
                        folder-path="../images/graphical_design"
                        images="skate.png">
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- components -->
    <script src="../components/gallery_component.js"></script>
    </body>
</html>
